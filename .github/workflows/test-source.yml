name: Test NBA source access
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/test_source.py
      - .github/workflows/test-source.yml
permissions:
  contents: write
concurrency:
  group: nba-source-diagnostic
  cancel-in-progress: false
jobs:
  test-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DuckDB on runner
        run: python -m pip install duckdb
      - name: Fetch source and write diagnostic
        run: python scripts/test_source.py
      - name: Commit diagnostic only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/source_access.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record NBA source access diagnostic'
            git push
          fi
      - name: Report test result
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          result = json.loads(Path('diagnostics/source_access.json').read_text())
          sys.exit(0 if result['ok'] else 1)
          PY
