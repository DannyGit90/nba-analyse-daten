name: Local model source check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/local_model_source.py
      - scripts/local_model_run.py
      - scripts/test_local_model_run.py
      - scripts/paper_monitor.py
      - scripts/test_local_model_source.py
      - scripts/paper_data_refresh.py
      - scripts/test_paper_data_refresh.py
      - scripts/test_paper_data_refresh_local.py
      - .github/workflows/local-model-source.yml
permissions:
  contents: read
concurrency:
  group: nba-local-model-source
  cancel-in-progress: false
jobs:
  check:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install duckdb numpy pandas scikit-learn
      - name: Test the local loader and unchanged completeness rules
        run: |
          python -m unittest discover -s scripts -p 'test_local_model_source.py' -v
          python -m unittest discover -s scripts -p 'test_paper_data_refresh*.py' -v
          python -m unittest discover -s scripts -p 'test_local_model_run.py' -v
      - name: Verify the actual standard model-input entry point
        env:
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import datetime as dt,json,os
          from pathlib import Path
          from paper_data_refresh import load_checked
          now=dt.datetime.now(dt.timezone.utc)
          result={'schema':'local-model-default-check-v1','execution_ok':False,'checked_at_utc':now.isoformat(),'code_sha':os.environ['GITHUB_SHA'],'betting_release':False}
          try:
              season=json.loads(Path('data/nba/manifest.json').read_text())['season']
              (data,schedule,teams),refresh=load_checked(season,now)
              result.update(execution_ok=not bool(refresh['unresolved_game_ids']),source_evidence=refresh['source_evidence'],refresh_status=refresh['status'],unresolved_game_ids=refresh['unresolved_game_ids'],read_attempts=refresh['read_attempts'])
          except Exception as exc:
              result['error']=(type(exc).__name__+': '+str(exc))[:800]
          Path(os.environ['RUNNER_TEMP'],'local-model-source.json').write_text(json.dumps(result,indent=2,allow_nan=False)+'\n')
          raise SystemExit(0 if result['execution_ok'] else 1)
          PY
      - name: Execute the unchanged full model in a temporary workspace
        run: python scripts/local_model_run.py --output "$RUNNER_TEMP/local-model-run"
      - name: Persist only acceptance results, including failures
        if: always()
        env:
          RESULT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/local-model-source.json" ]; then
            python - <<'PY'
          import json,os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'],'local-model-source.json').write_text(json.dumps({'execution_ok':False,'error':'Setup or tests did not produce a loader result','betting_release':False})+'\n')
          PY
          fi
          if [ ! -s "$RUNNER_TEMP/local-model-run/acceptance.json" ]; then
            python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'],'local-model-run');p.mkdir(exist_ok=True)
          (p/'acceptance.json').write_text(json.dumps({'schema':'local-model-run-v1','execution_ok':False,'acceptance_passed':False,'error':'Full model acceptance was not executed or produced no report','betting_release':False})+'\n')
          PY
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p diagnostics/local_model_source
            cp "$RUNNER_TEMP/local-model-source.json" "diagnostics/local_model_source/${RESULT_ID}.json"
            cp "$RUNNER_TEMP/local-model-source.json" diagnostics/local_model_source/latest.json
            mkdir -p "diagnostics/local_model_run/${RESULT_ID}"
            cp "$RUNNER_TEMP/local-model-run/acceptance.json" "diagnostics/local_model_run/${RESULT_ID}/acceptance.json"
            cp "$RUNNER_TEMP/local-model-run/acceptance.json" diagnostics/local_model_run/latest.json
            if [ -s "$RUNNER_TEMP/local-model-run/model_report.json" ]; then
              cp "$RUNNER_TEMP/local-model-run/model_report.json" "diagnostics/local_model_run/${RESULT_ID}/model_report.json"
            fi
            git add -- diagnostics/local_model_source/ diagnostics/local_model_run/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record local model source check ${RESULT_ID}"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
