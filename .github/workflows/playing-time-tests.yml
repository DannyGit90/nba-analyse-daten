name: Playing time regression
on:
  push:
    branches: [main]
    paths:
      - scripts/playing_time_checks.py
      - scripts/playing_time_fetch.py
      - scripts/test_playing_time_checks.py
      - scripts/test_playing_time_fetch.py
      - .github/workflows/playing-time-tests.yml
  pull_request:
    paths:
      - scripts/playing_time_checks.py
      - scripts/playing_time_fetch.py
      - scripts/test_playing_time_checks.py
      - scripts/test_playing_time_fetch.py
      - .github/workflows/playing-time-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthetic database test dependency
        run: python -m pip install duckdb
      - name: Run unchanged comparison tests and new SQL integration tests
        run: python -m unittest discover -s scripts -p 'test_playing_time*.py' -v
