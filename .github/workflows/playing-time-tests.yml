name: Playing time regression
on:
  push:
    branches: [main]
    paths:
      - scripts/playing_time_checks.py
      - scripts/playing_time_fetch.py
      - scripts/test_playing_time_checks.py
      - scripts/test_playing_time_fetch.py
      - scripts/run_playing_time_ci.py
      - .github/workflows/playing-time-tests.yml
  pull_request:
    paths:
      - scripts/playing_time_checks.py
      - scripts/playing_time_fetch.py
      - scripts/test_playing_time_checks.py
      - scripts/test_playing_time_fetch.py
      - scripts/run_playing_time_ci.py
      - .github/workflows/playing-time-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthetic database test dependency
        id: dependencies
        run: python -m pip install duckdb
      - name: Run suites and write commit-bound result
        if: always()
        env:
          DEPENDENCY_OUTCOME: ${{ steps.dependencies.outcome }}
        run: python scripts/run_playing_time_ci.py
      - name: Preserve result even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playing-time-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/
          if-no-files-found: error
  publish:
    needs: regression
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !cancelled()
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: nba-paper-monitor
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: playing-time-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/
      - name: Persist result without changing code or model approvals
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -s ci-results/result.json
          test -f ci-results/tests.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          destination="diagnostics/playing_time_ci/${RUN_ID}-${RUN_ATTEMPT}"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$destination"
            cp ci-results/result.json "$destination/result.json"
            cp ci-results/tests.txt "$destination/tests.txt"
            git add -- "$destination/result.json" "$destination/tests.txt"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record playing-time CI ${RUN_ID} attempt ${RUN_ATTEMPT}"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
