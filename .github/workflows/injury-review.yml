name: Official NBA personnel evidence
on:
  schedule:
    - cron: '20,50 16-23,0-3 * * *'
  workflow_run:
    workflows: ['Prospective NBA paper monitoring']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - scripts/injury_review.py
      - scripts/personnel_records.py
      - scripts/personnel_identity.py
      - scripts/playing_time_checks.py
      - scripts/test_playing_time_checks.py
      - scripts/personnel_identity_lookup.py
      - scripts/test_personnel_identity_lookup.py
      - scripts/test_personnel_identity.py
      - scripts/test_personnel_records.py
      - scripts/test_personnel_records_hyphens.py
      - scripts/test_injury_review.py
      - scripts/test_injury_review_repair.py
      - scripts/test_injury_review_midnight.py
      - .github/workflows/injury-review.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-paper-monitor
  cancel-in-progress: false
jobs:
  personnel:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind personnel outputs to this run
        run: echo "NBA_PERSONNEL_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Install PDF reader
        run: python -m pip install pypdf
      - name: Test official source identities and dated personnel sections
        id: tests
        run: python -m unittest discover -s scripts -p 'test_injury_review*.py' -v
      - name: Collect evidence and append visible personnel state
        if: always()
        env:
          INJURY_TESTS_OK: ${{ steps.tests.outcome }}
        run: python scripts/injury_review.py
      - name: Test explicit player status records
        if: always()
        id: records_tests
        run: python -m unittest discover -s scripts -p 'test_personnel_records*.py' -v
      - name: Structure official player status records
        if: always()
        env:
          PERSONNEL_RECORD_TESTS_OK: ${{ steps.records_tests.outcome }}
        run: python scripts/personnel_records.py
      - name: Test exact-name and dated-team matching core
        if: always()
        id: identity_tests
        run: |
          mkdir -p diagnostics
          python -m unittest discover -s scripts -p 'test_personnel_identity.py' -v > diagnostics/personnel_identity_tests.txt 2>&1
          cat diagnostics/personnel_identity_tests.txt
      - name: Install read-only identity reference reader
        if: always()
        run: python -m pip install duckdb
      - name: Test source-bound identity lookup
        if: always()
        id: lookup_tests
        run: |
          mkdir -p diagnostics
          python -m unittest discover -s scripts -p 'test_personnel_identity_lookup.py' -v > diagnostics/personnel_identity_lookup_tests.txt 2>&1
          cat diagnostics/personnel_identity_lookup_tests.txt
      - name: Resolve database identities and publish reference findings
        if: always()
        env:
          PERSONNEL_IDENTITY_TESTS_OK: ${{ steps.identity_tests.outcome }}
          PERSONNEL_LOOKUP_TESTS_OK: ${{ steps.lookup_tests.outcome }}
        run: python scripts/personnel_identity_lookup.py
      - name: Test minutes-seconds comparison core only
        if: always()
        id: playing_time_tests
        run: |
          mkdir -p diagnostics
          python -m unittest discover -s scripts -p 'test_playing_time_checks.py' -v > diagnostics/playing_time_checks_tests.txt 2>&1
          cat diagnostics/playing_time_checks_tests.txt
      - name: Persist personnel diagnostics and public daily supplement
        if: always()
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            new=$(python -c "import json;d=json.load(open('reports/injury/latest.json'));print(d.get('source_published_at_utc','') if d.get('status')=='captured_raw' else '')" 2>/dev/null || true)
            old=$(git show HEAD:reports/injury/latest.json 2>/dev/null | python -c "import json,sys;print(json.load(sys.stdin).get('source_published_at_utc',''))" 2>/dev/null || true)
            if [ -z "$new" ] || [ "$new" = "$old" ]; then
              echo 'No newer official report captured; nothing saved.'
              exit 0
            fi
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f diagnostics/personnel_identity_tests.txt ]; then git add diagnostics/personnel_identity_tests.txt; fi
          if [ -f diagnostics/personnel_identity_lookup_tests.txt ]; then git add diagnostics/personnel_identity_lookup_tests.txt; fi
          if [ -f diagnostics/playing_time_checks_tests.txt ]; then git add diagnostics/playing_time_checks_tests.txt; fi
          if [ -d reports/injury ]; then git add reports/injury/; fi
          if [ -d reports/daily ]; then git add reports/daily/; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record official NBA personnel evidence and daily source status'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
