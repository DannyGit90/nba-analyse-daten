name: Test experimental NBA model
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/test_model.py
      - .github/workflows/test-model.yml
permissions:
  contents: write
concurrency:
  group: nba-model-test
  cancel-in-progress: false
jobs:
  model-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model dependencies on runner
        run: python -m pip install duckdb numpy pandas scikit-learn
      - name: Run chronological model test
        run: python scripts/test_model.py
      - name: Commit reports and derived model only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/model_test.json
          if [ -f reports/model_state.json ]; then git add reports/model_state.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record experimental NBA model test'
            git push
          fi
      - name: Report execution result
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          result = json.loads(Path('reports/model_test.json').read_text())
          sys.exit(0 if result['execution_ok'] else 1)
          PY
