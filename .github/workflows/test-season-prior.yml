name: Test NBA season-start repair
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/test_season_prior.py
      - .github/workflows/test-season-prior.yml
permissions:
  contents: write
concurrency:
  group: nba-season-prior-test
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install duckdb numpy pandas scikit-learn
      - name: Test development-selected season prior
        run: python scripts/test_season_prior.py
      - name: Commit only repair diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/season_prior_test.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record season-start repair diagnostic'
            git push
          fi
      - name: Check execution
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          r = json.loads(Path('reports/season_prior_test.json').read_text())
          sys.exit(0 if r['execution_ok'] else 1)
          PY
