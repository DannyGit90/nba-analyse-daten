name: Prospective NBA paper monitoring
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1,5,9,13,17,21 * * *'
  push:
    paths:
      - scripts/paper_monitor.py
      - scripts/evaluate_paper.py
      - .github/workflows/paper-monitor.yml
permissions:
  contents: write
concurrency:
  group: nba-paper-monitor
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install duckdb numpy pandas scikit-learn
      - name: Generate and score frozen paper forecasts
        run: python scripts/paper_monitor.py
      - name: Evaluate prospective calibration and coverage
        run: python scripts/evaluate_paper.py
      - name: Commit derived paper reports and forecast archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/paper_latest.json paper_log/
          if [ -f reports/paper_evaluation.json ]; then git add reports/paper_evaluation.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record prospective NBA paper forecasts and calibration'
            git push
          fi
      - name: Check execution
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          p = json.loads(Path('reports/paper_latest.json').read_text())
          e = json.loads(Path('reports/paper_evaluation.json').read_text())
          sys.exit(0 if p['execution_ok'] and e['execution_ok'] else 1)
          PY
