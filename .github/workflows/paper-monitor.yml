name: Prospective NBA paper monitoring
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Persistent NBA source store]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - scripts/public_daily_report.py
      - scripts/test_public_daily_report.py
      - scripts/paper_monitor.py
      - scripts/paper_data_refresh.py
      - scripts/test_paper_data_refresh.py
      - scripts/evaluate_paper.py
      - scripts/probability_profile.py
      - scripts/test_probability_profile.py
      - scripts/check_paper_health.py
      - scripts/test_paper_health.py
      - scripts/research_packet.py
      - scripts/test_research_packet.py
      - scripts/daily_review.py
      - scripts/test_daily_review.py
      - scripts/test_daily_review_espn_schema.py
      - scripts/test_daily_review_binding.py
      - scripts/covers_review.py
      - scripts/reference_import.py
      - scripts/espn_line_import.py
      - scripts/test_daily_review_lines.py
      - scripts/pipeline_readiness.py
      - scripts/test_pipeline_readiness.py
      - scripts/test_reference_import.py
      - scripts/test_covers_review.py
      - scripts/finalize_market_reports.py
      - scripts/test_market_reporting.py
      - scripts/audit_market_reports.py
      - scripts/test_market_report_audit.py
      - scripts/push_pricing.py
      - scripts/test_push_pricing.py
      - docs/push-pricing-v1.md
      - .github/workflows/paper-monitor.yml
permissions:
  contents: write
concurrency:
  group: nba-paper-monitor
  cancel-in-progress: false
jobs:
  paper:
    if: >-
      github.event.repository.private == false &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record run start for fresh report binding
        run: echo "NBA_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Pin local snapshot and verify completed store run
        env:
          NBA_TRIGGER_EVENT: ${{ github.event_name }}
          NBA_TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          NBA_TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          body = Path('data/nba/manifest.json').read_bytes()
          manifest = json.loads(body)
          if manifest.get('schema') != 'nba-source-store-v1' or manifest.get('execution_ok') is not True:
              raise ValueError('Accepted local store manifest required')
          if manifest.get('betting_release') is not False or manifest.get('model_input_approved') is not False:
              raise ValueError('Unexpected store release flag')
          run_id = str(manifest.get('run_id', ''))
          if not re.fullmatch(r'\d+-\d+', run_id):
              raise ValueError('Invalid store run identity')
          if os.environ['NBA_TRIGGER_EVENT'] == 'workflow_run':
              expected = os.environ['NBA_TRIGGER_RUN_ID'] + '-' + os.environ['NBA_TRIGGER_RUN_ATTEMPT']
              status = json.loads(Path('reports/store/status.json').read_text())
              if status.get('execution_ok') is not True or status.get('run_id') != expected or run_id != expected:
                  raise ValueError('Completed upstream run and checked-out store disagree')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('NBA_STORE_MANIFEST_SHA256=' + hashlib.sha256(body).hexdigest() + '\n')
              output.write('NBA_BOUND_STORE_RUN_ID=' + run_id + '\n')
          PY
      - name: Test public daily reports and stale-run protection
        run: python -m unittest discover -s scripts -p 'test_public_daily_report.py' -v
      - name: Test paper availability checks
        run: python -m unittest discover -s scripts -p 'test_paper_health.py' -v
      - name: Test bounded source recovery and complete two-team records
        run: python -m unittest discover -s scripts -p 'test_paper_data_refresh.py' -v
      - name: Test normalization, ranking, coverage and report invariants
        run: python -m unittest discover -s scripts -p 'test_market_reporting.py' -v
      - name: Test independent published-report acceptance checks
        run: python -m unittest discover -s scripts -p 'test_market_report_audit.py' -v
      - name: Test gated experimental integer-line push calculation core
        run: python -m unittest discover -s scripts -p 'test_push_pricing.py' -v
      - run: python -m pip install duckdb numpy pandas scikit-learn
      - name: Test archived probability selection profile
        run: python -m unittest discover -s scripts -p 'test_probability_profile.py' -v
      - name: Test research export and half-point calculations
        run: python -m unittest discover -s scripts -p 'test_research_packet.py' -v
      - name: Test readable pages and actual offer calculations
        run: python -m unittest discover -s scripts -p 'test_daily_review*.py' -v
      - name: Test Covers scope, identity and price extraction
        run: python -m unittest discover -s scripts -p 'test_covers_review.py' -v
      - name: Test independent reference fallback
        run: python -m unittest discover -s scripts -p 'test_reference_import.py' -v
      - name: Test separated progress and non-invasive ESPN evidence
        run: python -m unittest discover -s scripts -p 'test_pipeline_readiness.py' -v
      - name: Generate frozen forecasts once and export research context
        run: python scripts/research_packet.py
      - name: Verify model used the bound local snapshot
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          expected = os.environ['NBA_STORE_MANIFEST_SHA256']
          if hashlib.sha256(Path('data/nba/manifest.json').read_bytes()).hexdigest() != expected:
              raise ValueError('Local snapshot changed during model execution')
          paper = json.loads(Path('reports/paper_latest.json').read_text())
          evidence = paper.get('data_refresh', {}).get('source_evidence', {})
          if evidence.get('manifest_sha256') != expected or evidence.get('store_run_id') != os.environ['NBA_BOUND_STORE_RUN_ID']:
              raise ValueError('Model did not use the bound local snapshot')
          if paper.get('money_betting_released') is not False or paper.get('production_model_changed') is not False:
              raise ValueError('Unexpected model release or parameter-change flag')
          PY
      - name: Attempt free references with per-selection ESPN fallback
        run: python scripts/reference_import.py
      - name: Normalize and rank paper references and publish actual coverage
        run: python scripts/finalize_market_reports.py
      - name: Independently audit all active published market pages
        run: python scripts/audit_market_reports.py
      - name: Evaluate prospective calibration and coverage
        run: python scripts/evaluate_paper.py
      - name: Record separated capture, calculation and model evidence status
        continue-on-error: true
        run: python scripts/pipeline_readiness.py
      - name: Assess execution separately from paper availability
        run: python scripts/check_paper_health.py --output reports/paper_health.json
      - name: Check actual paper, market availability and reporting quality
        run: |
          python scripts/check_paper_health.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('reports/chat_index.json').read_text())
          p = json.loads(Path('reports/paper_latest.json').read_text())
          m = json.loads(Path('reports/market_coverage.json').read_text())
          a = json.loads(Path('reports/market_reporting_audit.json').read_text())
          r = json.loads(Path('reports/pipeline_readiness.json').read_text())
          ok = r.get('execution_ok') is True and r.get('betting_release') is False
          ok = ok and all(r.get(k) == p.get(k) for k in ('generated_at_utc', 'protocol'))
          ok = ok and c.get('execution_ok') is True and m.get('execution_ok') is True and a.get('execution_ok') is True
          ok = ok and all(c.get(k) == p.get(k) == m.get(k) == a.get(k) for k in ('generated_at_utc', 'protocol'))
          ok = ok and m.get('unique_offer_count') == c.get('actual_offer_count') == a.get('offers_checked')
          ok = ok and c.get('computed_offer_count') == a.get('computed_checked')
          ok = ok and (not c.get('fixtures') or c.get('computed_offer_count', 0) > 0)
          raise SystemExit(0 if ok else 1)
          PY
      - name: Render public daily report with final upstream status
        if: always()
        env:
          NBA_PIPELINE_STATUS: ${{ job.status }}
        run: python scripts/public_daily_report.py
      - name: Save diagnostics and public daily reports even on failure
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/paper_latest.json paper_log/
          git add reports/research_packet.json reports/paper_distribution.json reports/chat_index.json
          if [ -f reports/market_coverage.json ]; then git add reports/market_coverage.json; fi
          if [ -f reports/market_reporting_audit.json ]; then git add reports/market_reporting_audit.json; fi
          if [ -d reports/chat ]; then git add reports/chat/; fi
          if [ -f reports/paper_evaluation.json ]; then git add reports/paper_evaluation.json; fi
          if [ -f reports/paper_health.json ]; then git add reports/paper_health.json; fi
          if [ -f reports/pipeline_readiness.json ]; then git add reports/pipeline_readiness.json; fi
          if [ -f reports/espn_price_fields.json ]; then git add reports/espn_price_fields.json; fi
          if [ -d reports/daily ]; then git add reports/daily/; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record NBA paper calculations, readable pages and source diagnostics'
            git push
          fi
