name: Prospective NBA paper monitoring
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1,5,9,13,17,21 * * *'
  push:
    paths:
      - scripts/paper_monitor.py
      - scripts/evaluate_paper.py
      - scripts/check_paper_health.py
      - scripts/test_paper_health.py
      - scripts/research_packet.py
      - scripts/test_research_packet.py
      - scripts/daily_review.py
      - scripts/test_daily_review.py
      - scripts/covers_review.py
      - scripts/test_covers_review.py
      - scripts/finalize_market_reports.py
      - scripts/test_market_reporting.py
      - .github/workflows/paper-monitor.yml
permissions:
  contents: write
concurrency:
  group: nba-paper-monitor
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test paper availability checks
        run: python -m unittest discover -s scripts -p 'test_paper_health.py' -v
      - name: Test normalization, ranking, coverage and report invariants
        run: python -m unittest discover -s scripts -p 'test_market_reporting.py' -v
      - run: python -m pip install duckdb numpy pandas scikit-learn
      - name: Test research export and half-point calculations
        run: python -m unittest discover -s scripts -p 'test_research_packet.py' -v
      - name: Test readable pages and actual offer calculations
        run: python -m unittest discover -s scripts -p 'test_daily_review.py' -v
      - name: Test Covers scope, identity and price extraction
        run: python -m unittest discover -s scripts -p 'test_covers_review.py' -v
      - name: Generate frozen forecasts once and export research context
        run: python scripts/research_packet.py
      - name: Attempt free Covers references and calculate actual returned offers
        run: python scripts/covers_review.py
      - name: Normalize and rank paper references and publish actual coverage
        run: python scripts/finalize_market_reports.py
      - name: Evaluate prospective calibration and coverage
        run: python scripts/evaluate_paper.py
      - name: Assess execution separately from paper availability
        run: python scripts/check_paper_health.py --output reports/paper_health.json
      - name: Save diagnostics before checking market coverage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/paper_latest.json paper_log/
          git add reports/research_packet.json reports/paper_distribution.json reports/chat_index.json
          if [ -f reports/market_coverage.json ]; then git add reports/market_coverage.json; fi
          if [ -d reports/chat ]; then git add reports/chat/; fi
          if [ -f reports/paper_evaluation.json ]; then git add reports/paper_evaluation.json; fi
          if [ -f reports/paper_health.json ]; then git add reports/paper_health.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record NBA paper calculations, readable pages and source diagnostics'
            git push
          fi
      - name: Check actual paper, market availability and reporting quality
        run: |
          python scripts/check_paper_health.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('reports/chat_index.json').read_text())
          p = json.loads(Path('reports/paper_latest.json').read_text())
          m = json.loads(Path('reports/market_coverage.json').read_text())
          ok = c.get('execution_ok') is True and m.get('execution_ok') is True
          ok = ok and all(c.get(k) == p.get(k) == m.get(k) for k in ('generated_at_utc', 'protocol'))
          ok = ok and m.get('unique_offer_count') == c.get('actual_offer_count')
          ok = ok and (not c.get('fixtures') or c.get('computed_offer_count', 0) > 0)
          raise SystemExit(0 if ok else 1)
          PY
