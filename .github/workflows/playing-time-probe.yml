name: Playing time live diagnostic
on:
  push:
    branches: [main]
    paths:
      - scripts/playing_time_probe.py
      - scripts/test_playing_time_probe.py
      - .github/workflows/playing-time-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install duckdb
      - run: python -m unittest discover -s scripts -p 'test_playing_time*.py' -v
  probe:
    needs: tests
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: nba-paper-monitor
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install duckdb
      - name: Compare at most ten keys using read-only source access
        run: python scripts/playing_time_probe.py
      - name: Preserve live diagnostic including source failures
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -s probe-results/result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          destination="diagnostics/playing_time_probe/${RUN_ID}-${RUN_ATTEMPT}"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$destination"
            cp probe-results/result.json "$destination/result.json"
            git add -- "$destination/result.json"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record playing-time live diagnostic ${RUN_ID} attempt ${RUN_ATTEMPT}"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
