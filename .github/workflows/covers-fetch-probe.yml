name: One-page Covers fetch diagnostic
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/covers-fetch-probe.yml
      - scripts/covers_fetch_probe.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-covers-fetch-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch exactly one page without running the model
        run: python scripts/covers_fetch_probe.py
      - name: Save the diagnostic report, including retrieval errors
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/covers_fetch_probe.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record single-page Covers fetch diagnostic'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Check retrieval after saving its diagnostic
        run: python -c "import json; from pathlib import Path; r = json.loads(Path('reports/covers_fetch_probe.json').read_text()); raise SystemExit(0 if r.get('execution_ok') is True else 1)"
