name: Summarize model and probe schedule
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/summarize_model.py
      - .github/workflows/summarize-model.yml
permissions:
  contents: write
concurrency:
  group: nba-model-summary
  cancel-in-progress: false
jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install duckdb
      - run: python scripts/summarize_model.py
      - name: Commit compact report only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/model_summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record compact model summary and schedule schema'
            git push
          fi
      - name: Check probe result
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          r = json.loads(Path('reports/model_summary.json').read_text())
          sys.exit(0 if r['schedule_probe']['ok'] else 1)
          PY
